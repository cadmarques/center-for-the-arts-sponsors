<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Center for the Arts — Sponsors</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  
  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="main-header">
    <div class="logo-wrapper">
      <!-- Substitui por <img src="assets/images/logo.png" class="logo-img" alt="Logo" /> -->
      <!--<div class="logo-placeholder">🎭</div> -->
      <img src="assets/CAlogo.png" alt="Center for the Arts logo" class="logo-img" />
      <div class="logo-text">Center for the Arts</div>
      <div class="logo-tagline">Discover. Connect. Be inpired.</div>
    </div>
  </header>

  <main>
    <!-- SLIDESHOW -->
    <section class="slideshow-section">
      <div class="slideshow-container" id="slideshow">
        <div class="slide active"><div class="slide-content">🏛️ Center for the Arts</div></div>
        <div class="slide"><div class="slide-content">🎨 Art Exhibitions</div></div>
        <div class="slide"><div class="slide-content">🎵 Live Performances</div></div>
        <div class="slide"><div class="slide-content">💃 Community Events</div></div>
        <button class="slide-btn prev" aria-label="Slide anterior">&#10094;</button>
        <button class="slide-btn next" aria-label="Slide seguinte">&#10095;</button>
      </div>
      <div class="slide-dots" id="slideDots"></div>
    </section>

    <!-- VIP SPONSORS -->
    <section class="vip-section">
      <h2 class="section-title">VIP</h2>
      <p class="section-subtitle">Our main partners of excelence</p>
      <div class="grid-container" id="vipGrid">
        <!-- Cards injetados via JS -->
      </div>
    </section>

    <!-- ALL SPONSORS + SEARCH -->
    <section class="sponsors-section">
      <h2 class="section-title">Sponsors</h2>
      <p class="section-subtitle">Discover our esteemd Sponsors</p>

      <div class="search-wrapper">
        <div class="search-input-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" class="search-input" placeholder="Search for name, description or key-word..." autocomplete="off" />
        </div>
        <button id="clearBtn" class="btn-clear">✕ Clear</button>
      </div>

      <p id="resultsInfo" class="results-info"></p>
      <div class="grid-container" id="regularGrid">
        <!-- Cards injetados via JS -->
      </div>
    </section>
  </main>

  <footer class="main-footer">
    &copy; <span id="year"></span> Center for the Arts. All rights reserved.
  </footer>

  <!-- JS -->
  <script src="js/app.js" defer></script>
</body>
</html>
